{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SpotHop - Profile</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/user_profile/user_profile.css' %}">
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-success px-4 mb-4">
    <a class="navbar-brand fw-bold" href="{% url 'home:home' %}">← Back to Home</a>
  </nav>
  <div class="container" style="max-width: 500px;">
    <div class="card shadow-sm p-4 border-0">
      <h3 class="fw-bold text-success mb-3">Student Profile</h3>
      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label">Username</label>
          <input type="text" class="form-control" value="{{ request.user.username }}" disabled>
        </div>
        <div class="mb-3">
          <label class="form-label">Full Name</label>
          <input type="text" name="full_name" class="form-control" value="{{ profile.full_name }}">
        </div>
        <div class="mb-3">
          <label class="form-label">Bio / Study Preferences</label>
          <textarea name="bio" class="form-control" rows="3">{{ profile.bio }}</textarea>
        </div>
        <button type="submit" class="btn btn-success w-100">Save Profile</button>
      </form>
    </div>
  </div>
  <script src="{% static 'js/user_profile/user_profile.js' %}"></script>
</body>
</html>
