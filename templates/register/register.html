{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SpotHop - Register</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/register/register.css' %}">
</head>
<body class="bg-light d-flex align-items-center min-vh-100">
  <div class="container" style="max-width: 420px;">
    <div class="card shadow-sm p-4 border-0">
      <h2 class="fw-bold text-success text-center">SpotHop</h2>
      <p class="text-muted text-center mb-4">Create your Account</p>
      {% if error %}<div class="alert alert-danger py-2">{{ error }}</div>{% endif %}
      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label">Username</label>
          <input type="text" name="username" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" name="email" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-success w-100">Register</button>
      </form>
      <div class="text-center mt-3">
        <small class="text-muted">Already registered? <a href="{% url 'login:login' %}" class="text-success text-decoration-none">Back to Login</a></small>
      </div>
    </div>
  </div>
  <script src="{% static 'js/register/register.js' %}"></script>
</body>
</html>
