{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SpotHop - Settings</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/user_settings/user_settings.css' %}">
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-success px-4 mb-4">
    <a class="navbar-brand fw-bold" href="{% url 'home:home' %}">← Back to Home</a>
  </nav>
  <div class="container" style="max-width: 500px;">
    <div class="card shadow-sm p-4 border-0">
      <h3 class="fw-bold text-success mb-3">Settings</h3>
      <form method="post">
        {% csrf_token %}
        <div class="form-check form-switch mb-3">
          <input class="form-check-input" type="checkbox" name="dark_mode" id="dm" {% if settings.dark_mode %}checked{% endif %}>
          <label class="form-check-label" for="dm">Dark Mode</label>
        </div>
        <div class="form-check form-switch mb-4">
          <input class="form-check-input" type="checkbox" name="email_notifications" id="notif" {% if settings.email_notifications %}checked{% endif %}>
          <label class="form-check-label" for="notif">Study Spot Notifications</label>
        </div>
        <button type="submit" class="btn btn-success w-100">Save Preferences</button>
      </form>
    </div>
  </div>
  <script src="{% static 'js/user_settings/user_settings.js' %}"></script>
</body>
</html>
